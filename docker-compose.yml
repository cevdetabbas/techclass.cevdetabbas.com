services:
  app:
    build: .
    image: techclass.cevdetabbas.com:latest
    container_name: techclass.cevdetabbas.com
    ports:
      - "${WSL_IP:?Set WSL_IP or run ./start-techclass-wsl.sh}:2930:2930"
    environment:
      NODE_ENV: production
      PORT: "2930"
      DATA_DIR: /app/data
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
